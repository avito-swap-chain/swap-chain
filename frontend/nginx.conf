server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API to the Go backend service (uncomment when wired in docker-compose)
  # location /api/ {
  #   proxy_pass http://backend:8080/;
  # }
}
