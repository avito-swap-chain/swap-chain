server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Бэкенд отдаётся с того же адреса, что и фронт. Это не только про удобство:
  # сессия живёт в куке с SameSite=Lax, и на кросс-доменный запрос она бы не ушла,
  # а CORS с credentials пришлось бы настраивать отдельно. Один origin снимает оба вопроса.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Поток событий (/api/v1/events) — SSE: буферизация задержала бы сообщения
    # до закрытия соединения, а таймаут рвал бы подписку каждую минуту.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}
