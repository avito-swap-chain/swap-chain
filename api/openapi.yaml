  /api/v1/admin/deliveries/{deliveryId}/transition:
    parameters:
      - name: deliveryId
        in: path
        required: true
        description: chain_items identifier returned by the admin delivery list.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      operationId: transitionAdminDelivery
      tags: [admin]
      summary: Confirm pickup-point receipt, dispatch, or recipient hand-off
      description: Repeating a transition to the current status is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDeliveryTransitionRequest"
            examples:
              acceptAtPickupPoint:
                value: {status: AT_PVZ}
              dispatch:
                value: {status: IN_DELIVERY}
              handOffToRecipient:
                value: {status: RECEIVED}
      responses:
        "200":
          description: Current delivery after applying the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDelivery"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
