          description: Delivery ID returned as nextCursor by the previous page.
          schema:
            type: string
      responses:
        "200":
          description: Deliveries visible to pickup-point staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeliveryList"
              example:
                deliveries:
                  - id: 41
                    chainId: 12
                    itemId: 55
                    itemTitle: Samsung Galaxy M54 5G
                    sender: {id: 7, username: Алиса}
                    recipient: {id: 9, username: Вера}
                    status: AWAITING_PVZ
                    updatedAt: "2026-08-10T12:00:00Z"
                nextCursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
