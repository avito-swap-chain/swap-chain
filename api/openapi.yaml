        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/reports/{reportId}/decision:
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      operationId: decideReport
      tags: [moderation]
      summary: Resolve or reject an open report assigned to the current administrator
      description: >-
        Requires ADMIN. Only the assignee may decide, once, with a mandatory
        decision comment. The decision classifies the report and does not
        execute any sanction; user, message, chat, item and chain state remain
        unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDecisionRequest"
      responses:
        "200":
          description: Report after the terminal decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/audit:
    get:
      operationId: listAdminAudit
      tags: [moderation]
      summary: List the append-only administrator audit log
      description: Requires ADMIN. Newest first, cursor-paginated.
      parameters:
        - name: action
          in: query
          schema:
            $ref: "#/components/schemas/AuditAction"
        - name: adminId
          in: query
          description: Filter to audit entries written by this administrator.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: targetType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Audit entry ID returned as nextCursor by the previous page.
          schema:
            type: string
      responses:
        "200":
          description: Audit log entries newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  responses:
    BadRequest:
      description: Request cannot be parsed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request violates validation rules
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: A demo session cookie is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The current user cannot access this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The command conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: Operation is defined but its business service is not connected yet
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required backend dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: swap_chain_session

  schemas:
    LivenessResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [alive]
        timestamp:
          type: string
          format: date-time

    HealthResponse:
      type: object
      required: [status, database, analysis, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [up]
        analysis:
          type: string
          enum: [ready]
        timestamp:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [username, phone]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          minLength: 10
          maxLength: 32

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        avatarUrl:
          type: string
          format: uri-reference
          description: Set a profile photo URL (upload via POST /api/v1/media first). Pass an empty string to remove.

    LoginRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          minLength: 10
          maxLength: 32

    UserRole:
      type: string
      enum: [USER, ADMIN]

    CurrentUser:
      type: object
      required: [id, username, phone, role, createdAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        phone:
          type: string
          description: Canonical E.164-like phone used for demo login
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time

    Session:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        expiresAt:
          type: string
          format: date-time

    CreateItemRequest:
      type: object
      required: [offerTitle, offerDescription, categoryId, condition, wishes]
      properties:
        offerTitle:
          type: string
          minLength: 1
          maxLength: 255
        offerDescription:
          type: string
          minLength: 1
          maxLength: 4000
        wishes:
          type: array
          items:
            type: string
          description: A list of items the user wants in exchange for this item
          minLength: 1
          maxLength: 4000
        imageUrls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri-reference
        categoryId:
          type: integer
          format: int32
          description: Required user-selected offer category. Must reference an existing user-facing category; undefined category (47) is rejected. Wish categories are determined by the analysis pipeline from their descriptions.
        condition:
          $ref: "#/components/schemas/ItemCondition"

    UpdateItemRequest:
      type: object
      minProperties: 1
      properties:
        offerTitle:
          type: string
          minLength: 1
          maxLength: 255
        offerDescription:
          type: string
          minLength: 1
          maxLength: 4000
        wishes:
          type: array
          items:
            type: string
        withdraw:
          type: boolean
          description: Remove the wish and stop matching this item. Cannot be combined with wishes.
        categoryId:
          type: integer
          format: int32
          description: User-selected offer category. Must reference an existing user-facing category; undefined category (47) is rejected.
        condition:
          $ref: "#/components/schemas/ItemCondition"

    ItemCondition:
      type: string
      description: User-confirmed physical condition. Vision analysis may suggest it but cannot persist it without user confirmation.
      enum: [NEW, GOOD, USED]

    ResolveItemCategoriesRequest:
      type: object
      minProperties: 1
      properties:
        offerCategoryId:
          type: integer
          format: int32
          minimum: 1
          description: Legacy-only decision for cards created before offer category became mandatory.
        wishes:
          type: array
          items:
            $ref: "#/components/schemas/WishCategoryDecision"

    WishCategoryDecision:
      type: object
      required: [wishId, categoryId]
      properties:
        wishId:
          type: integer
          format: int64
          minimum: 1
        categoryId:
          type: integer
          format: int32
          minimum: 1

    MediaUpload:
      type: object
      required: [url, contentType, size]
      properties:
        url:
          type: string
          format: uri-reference
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          format: int64
          minimum: 1

    Item:
      type: object
      required:
        - id
        - userId
        - offerTitle
        - offerDescription
        - wishes
        - imageUrls
        - status
        - condition
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        offerTitle:
          type: string
        offerDescription:
          type: string
        wishes:
          type: array
          items:
            $ref: "#/components/schemas/ItemWish"
        imageUrls:
          type: array
          items:
            type: string
            format: uri-reference
        status:
          $ref: "#/components/schemas/ItemStatus"
        condition:
          $ref: "#/components/schemas/ItemCondition"
        categoryId:
          type: integer
          format: int32
          nullable: true
          description: User-selected offer category. Required for newly created cards. Maps to offer_category_id.
        offerCategoryId:
          type: integer
          format: int32
          nullable: true
          description: Compatibility alias of categoryId backed by offer_category_id.
        wantCategoryId:
          type: integer
          format: int32
          nullable: true
          description: Assigned by AI analysis; null until analysis completes.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ItemWish:
      type: object
      required: [id, description]
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int32
          nullable: true
        description:
          type: string

    ItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        nextCursor:
          type: string
          nullable: true

    ItemStatus:
      type: string
      enum: [ANALYZING, ACTION_REQUIRED, MATCHING, LOCKED, EXCHANGED, WITHDRAWN]

    Category:
      type: object
      required: [id, name, isSystem]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        isSystem:
          type: boolean

    CategoryList:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    ChainStatus:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, COMPLETED]

    ParticipantStatus:
      type: string
      enum: [WAITING, APPROVED, DECLINED]

    ChainDecision:
      type: string
      enum: [APPROVED, DECLINED]

    UserSummary:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string

    UserProfile:
      type: object
      required: [id, username, createdAt, completedExchanges, rating, reviewsCount]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        avatarUrl:
          type: string
          format: uri-reference
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedExchanges:
          type: integer
          format: int64
          minimum: 0
        rating:
          type: number
          format: double
          minimum: 1
          maximum: 5
          nullable: true
          description: Average review rating. Null until the first review.
        reviewsCount:
          type: integer
          format: int64
          minimum: 0

    CreateUserReviewRequest:
      type: object
      required: [targetUserId, rating]
      properties:
        targetUserId:
          type: integer
          format: int64
          minimum: 1
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
          maxLength: 1000

    UserReview:
      type: object
      required: [id, chainId, author, targetUserId, rating, createdAt]
      properties:
        id:
          type: integer
          format: int64
        chainId:
          type: integer
          format: int64
        author:
          $ref: "#/components/schemas/UserSummary"
        targetUserId:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    UserReviewList:
      type: object
      required: [reviews]
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/UserReview"
        nextCursor:
          type: string

    ChainParticipant:
      type: object
      required: [user, giveItem, receiveItem, status, receiptConfirmed, incomingDeliveryStatus, incomingDeliveryUpdatedAt]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        giveItem:
          $ref: "#/components/schemas/Item"
        receiveItem:
          $ref: "#/components/schemas/Item"
        status:
          $ref: "#/components/schemas/ParticipantStatus"
        receiptConfirmed:
          type: boolean
          description: Whether the participant has confirmed receipt of their incoming item.
        receiptConfirmedAt:
          type: string
          format: date-time
          nullable: true
          description: When the participant confirmed receipt. Null until confirmed.
        incomingDeliveryStatus:
          $ref: "#/components/schemas/AdminDeliveryStatus"
        incomingDeliveryUpdatedAt:
          type: string
          format: date-time
          description: When the incoming delivery last changed status.

    Chain:
      type: object
      required: [id, status, participants, createdAt, expiresAt]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ChainStatus"
        participants:
          type: array
          minItems: 2
          maxItems: 3
          items:
            $ref: "#/components/schemas/ChainParticipant"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    ChainList:
      type: object
      required: [chains]
      properties:
        chains:
          type: array
          items:
            $ref: "#/components/schemas/Chain"
        nextCursor:
          type: string
          nullable: true

    MatchingResponse:
      type: object
      required: [itemId, cycles]
      properties:
        itemId:
          type: integer
          format: int64
          minimum: 1
        cycles:
          type: array
          items:
            $ref: "#/components/schemas/MatchingCycle"

    MatchingCycle:
      type: object
      required: [edges]
      properties:
        edges:
          type: array
          items:
            $ref: "#/components/schemas/MatchingEdge"

    MatchingEdge:
      type: object
      required: [sourceItemId, targetItemId, score]
      properties:
        sourceItemId:
          type: integer
          format: int64
          minimum: 1
        targetItemId:
          type: integer
          format: int64
          minimum: 1
        score:
          type: number
          minimum: 0
          maximum: 1

    ChainEdge:
      type: object
      required: [sourceItemId, targetItemId]
      properties:
        sourceItemId:
          type: integer
          format: int64
          minimum: 1
        targetItemId:
          type: integer
          format: int64
          minimum: 1

    CreateChainRequest:
      type: object
      required: [edges]
      properties:
        edges:
          type: array
          minItems: 2
          maxItems: 3
          items:
            $ref: "#/components/schemas/ChainEdge"

    SubmitChainDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/ChainDecision"

    SendChatMessageRequest:
      type: object
      required: [clientMessageId, text]
      properties:
        clientMessageId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$"
          description: Client-generated idempotency key scoped to item, sender and counterpart.
        text:
          type: string
          minLength: 1
          maxLength: 2000

    ChatMessage:
      type: object
      required: [id, itemId, sender, recipient, clientMessageId, text, createdAt]
      properties:
        id:
          type: integer
          format: int64
        itemId:
          type: integer
          format: int64
        sender:
          $ref: "#/components/schemas/UserSummary"
        recipient:
          $ref: "#/components/schemas/UserSummary"
        clientMessageId:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time

    ChatMessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        nextAfterId:
          type: integer
          format: int64
          nullable: true

    ChatThread:
      type: object
      required: [item, counterpart, hasUnread, unreadCount]
      properties:
        item:
          $ref: "#/components/schemas/ChatItemSummary"
        counterpart:
          $ref: "#/components/schemas/UserSummary"
        lastMessage:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ChatMessage"
        hasUnread:
          type: boolean
        unreadCount:
          type: integer
          format: int64
          minimum: 0

    ChatItemSummary:
      type: object
      required: [id, title, imageUrl]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        imageUrl:
          type: string
          nullable: true

    ChatThreadList:
      type: object
      required: [threads, totalUnreadCount]
      properties:
        threads:
          type: array
          items:
            $ref: "#/components/schemas/ChatThread"
        totalUnreadCount:
          type: integer
          format: int64
          minimum: 0

    MarkChatThreadReadRequest:
      type: object
      required: [lastReadMessageId]
      properties:
        lastReadMessageId:
          type: integer
          format: int64
          minimum: 1

    ChatReadState:
      type: object
      required: [itemId, counterpartId, lastReadMessageId, unreadCount]
      properties:
        itemId:
          type: integer
          format: int64
        counterpartId:
          type: integer
          format: int64
        lastReadMessageId:
          type: integer
          format: int64
        unreadCount:
          type: integer
          format: int64
          minimum: 0

    SupportSenderType:
      type: string
      enum: [USER, MODERATOR, SYSTEM]

    SupportMessage:
      type: object
      required: [id, threadId, senderType, text, createdAt]
      properties:
        id: {type: integer, format: int64}
        threadId: {type: integer, format: int64}
        senderType: {$ref: "#/components/schemas/SupportSenderType"}
        sender:
          nullable: true
          allOf: [{$ref: "#/components/schemas/UserSummary"}]
        clientMessageId: {type: string, nullable: true}
        text: {type: string}
        createdAt: {type: string, format: date-time}

    SupportMessageList:
      type: object
      required: [messages]
      properties:
        messages: {type: array, items: {$ref: "#/components/schemas/SupportMessage"}}
        nextAfterId: {type: integer, format: int64, nullable: true}

    SupportThread:
      type: object
      required: [id, user, moderators, lastMessage, unreadCount, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        user: {$ref: "#/components/schemas/UserSummary"}
        moderators: {type: array, items: {$ref: "#/components/schemas/UserSummary"}}
        lastMessage:
          nullable: true
          allOf: [{$ref: "#/components/schemas/SupportMessage"}]
        unreadCount: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    SupportReadState:
      type: object
      required: [threadId, lastReadMessageId, unreadCount]
      properties:
        threadId: {type: integer, format: int64}
        lastReadMessageId: {type: integer, format: int64}
        unreadCount: {type: integer, format: int64, minimum: 0}

    AdminDeliveryStatus:
      type: string
      description: Physical hand-off state of one item in an assembled chain.
      enum: [AWAITING_PVZ, AT_PVZ, IN_DELIVERY, RECEIVED]

    AdminDeliveryTransitionStatus:
      type: string
      enum: [AT_PVZ, IN_DELIVERY, RECEIVED]

    AdminDeliveryTransitionRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/AdminDeliveryTransitionStatus"

    AdminDelivery:
      type: object
      required: [id, chainId, itemId, itemTitle, sender, recipient, status, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        chainId:
          type: integer
          format: int64
        itemId:
          type: integer
          format: int64
        itemTitle:
          type: string
        sender:
          $ref: "#/components/schemas/UserSummary"
        recipient:
          $ref: "#/components/schemas/UserSummary"
        status:
          $ref: "#/components/schemas/AdminDeliveryStatus"
        updatedAt:
          type: string
          format: date-time

    AdminDeliveryList:
      type: object
      required: [deliveries]
      properties:
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/AdminDelivery"
        nextCursor:
          type: string
          nullable: true

    FunnelMetrics:
      type: object
      required:
        - generatedAt
        - eligibleItems
        - itemsWithChain
        - itemsWithChainRate
        - averageTimeToFirstChainSeconds
        - decidedChains
        - acceptedChains
        - acceptanceRate
        - completedChains
        - deliveryCompletionRate
        - rejectionReasons
      properties:
        generatedAt:
          type: string
          format: date-time
        eligibleItems:
          type: integer
          format: int64
          minimum: 0
          description: Current MATCHING or LOCKED items.
        itemsWithChain:
          type: integer
          format: int64
          minimum: 0
          description: Eligible items that have participated in at least one persisted chain.
        itemsWithChainRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        averageTimeToFirstChainSeconds:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Average time from item creation to its first persisted chain.
        decidedChains:
          type: integer
          format: int64
          minimum: 0
          description: ACCEPTED, COMPLETED or REJECTED chains; PENDING is excluded.
        acceptedChains:
          type: integer
          format: int64
          minimum: 0
          description: Chains that reached ACCEPTED, including subsequently COMPLETED chains.
        acceptanceRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        completedChains:
          type: integer
          format: int64
          minimum: 0
        deliveryCompletionRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: COMPLETED divided by all chains that reached ACCEPTED.
        rejectionReasons:
          type: array
          items:
            $ref: "#/components/schemas/FunnelRejectionReason"

    FunnelRejectionReason:
      type: object
      required: [reason, count]
      properties:
        reason:
          type: string
          enum: [declined, expired, item_unavailable, item_changed, item_withdrawn, blocked, unknown]
        count:
          type: integer
          format: int64
          minimum: 0

    BlockRequest:
      type: object
      required: [blockedUserId]
      properties:
        blockedUserId:
          type: integer
          format: int64
          minimum: 1
          description: User to block. Must differ from the current user.

    Block:
      type: object
      required: [id, blockedUser, createdAt]
      properties:
        id:
          type: integer
          format: int64
        blockedUser:
          $ref: "#/components/schemas/UserSummary"
        createdAt:
          type: string
          format: date-time

    BlockList:
      type: object
      required: [blocks]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Block"
        nextCursor:
          type: string
          nullable: true

    ReportStatus:
      type: string
      enum: [open, resolved, rejected]

    ReportReason:
      type: string
      enum: [spam, abuse, other]

    ReportDecision:
      type: string
      enum: [resolved, rejected]

    CreateReportRequest:
      type: object
      required: [messageId, reason]
      properties:
        messageId:
          type: integer
          format: int64
          minimum: 1
        reason:
          $ref: "#/components/schemas/ReportReason"
        comment:
          type: string
          maxLength: 1000
          description: Optional for spam/abuse, required for other.

    UserReportReason:
      type: string
      enum: [item, noshow, rude, fraud, other]

    CreateUserReportRequest:
      type: object
      required: [reason]
      properties:
        chainId:
          type: integer
          format: int64
          minimum: 1
        reason:
          $ref: "#/components/schemas/UserReportReason"
        comment:
          type: string
          maxLength: 1000
          description: Optional except for reason other, when it is required.

    UserReport:
      type: object
      required: [id, reporterUserId, targetUserId, reason, createdAt]
      properties:
        id:
          type: integer
          format: int64
        reporterUserId:
          type: integer
          format: int64
        targetUserId:
          type: integer
          format: int64
        chainId:
          type: integer
          format: int64
          nullable: true
        reason:
          $ref: "#/components/schemas/UserReportReason"
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    MessageReport:
      type: object
      required: [id, reporter, messageId, reason, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        reporter:
          $ref: "#/components/schemas/UserSummary"
        messageId:
          type: integer
          format: int64
        reason:
          $ref: "#/components/schemas/ReportReason"
        comment:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ReportStatus"
        assignee:
          $ref: "#/components/schemas/UserSummary"
          nullable: true
        decisionComment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MessageReportList:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/MessageReport"
        nextCursor:
          type: string
          nullable: true

    ReportDetail:
      type: object
      required: [report, reportedMessage, context]
      properties:
        report:
          $ref: "#/components/schemas/MessageReport"
        reportedMessage:
          $ref: "#/components/schemas/ChatMessage"
        context:
          type: array
          description: Full thread context (chain + message sender/recipient) in ascending message ID order.
          items:
            $ref: "#/components/schemas/ChatMessage"

    ReportDecisionRequest:
      type: object
      required: [decision, comment]
      properties:
        decision:
          $ref: "#/components/schemas/ReportDecision"
        comment:
          type: string
          minLength: 1
          maxLength: 1000
          description: Mandatory non-empty internal decision rationale.

    AuditAction:
      type: string
      enum:
        - REPORT_ASSIGNED
        - REPORT_RESOLVED
        - REPORT_REJECTED
        - USER_BLOCKED
        - CHAIN_CANCELLED
        - DELIVERY_STATUS_CHANGED

    AuditLogEntry:
      type: object
      required: [id, admin, action, targetType, targetId, metadata, createdAt]
      properties:
        id:
          type: integer
          format: int64
        admin:
          $ref: "#/components/schemas/UserSummary"
        action:
          $ref: "#/components/schemas/AuditAction"
        targetType:
          type: string
          description: Structural target kind (e.g. report, delivery). No message body or personal data.
        targetId:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true
          description: >-
            Structural identifiers and before/after state only; never a message
            body, decision comment, secret or arbitrary personal data.
        createdAt:
          type: string
          format: date-time

    AuditLogList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        nextCursor:
          type: string
          nullable: true

    ChainReceipt:
      type: object
      required: [delivery, chainStatus]
      properties:
        delivery:
          $ref: "#/components/schemas/AdminDelivery"
        chainStatus:
          $ref: "#/components/schemas/ChainStatus"

    NotificationKind:
      type: string
      enum: [CHAIN, OFFER, MESSAGE, DELIVERY]

    AppNotification:
      type: object
      required: [id, kind, title, text, createdAt, read]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/NotificationKind"
        title:
          type: string
        text:
          type: string
        chainId:
          type: integer
          format: int64
          nullable: true
        itemId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean

    NotificationList:
      type: object
      required: [notifications, totalUnread]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/AppNotification"
        nextCursor:
          type: string
          nullable: true
        totalUnread:
          type: integer
          format: int64
          minimum: 0

    MarkNotificationsReadRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1

    PipelineEvent:
      type: object
      required: [id, type, occurredAt]
      properties:
        id:
          type: string
        type:
          type: string
          example: item.status.updated
        entityId:
          type: string
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true

    VisualQuality:
      type: string
      description: Physical condition of the item as determined by AI vision analysis.
      enum: [NEW, EXCELLENT, GOOD, FAIR, POOR]

    VisionAnalysisAccepted:
      type: object
      required: [imageUrl, status]
      properties:
        imageUrl:
          type: string
          format: uri-reference
        status:
          type: string
          description: Always "accepted" — results arrive asynchronously via SSE

    VisionAnalysisResponse:
      type: object
      required:
        - imageUrl
        - suggestedCategory
        - visualQuality
        - qualityScore
        - marketplaceDescription
      properties:
        imageUrl:
          type: string
          format: uri-reference
          description: URL of the analyzed photo
        suggestedCategory:
          type: string
          description: AI-suggested marketplace category from the supported category list
        visualQuality:
          $ref: "#/components/schemas/VisualQuality"
        qualityScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Numeric assessment of the item's condition where 1.0 is flawless
        marketplaceDescription:
          type: string
          description: AI-generated professional marketplace-style description in Russian
