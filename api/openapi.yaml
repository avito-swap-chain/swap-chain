  /api/v1/blocks:
    get:
      operationId: listBlocks
      tags: [blocks]
      summary: List the current user's personal blacklist
      description: Requires an authenticated user. Returns only users blocked by the current actor.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Block ID returned as nextCursor by the previous page.
          schema:
            type: string
      responses:
        "200":
          description: Current user's blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: blockUser
      tags: [blocks]
      summary: Block another user
      description: >-
        Directed block that also acts symmetrically for matching. Idempotent;
        atomically cancels shared non-terminal chains with the blocked user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockRequest"
      responses:
        "200":
          description: Block applied (or already present)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/blocks/{blockedUserId}:
    parameters:
      - name: blockedUserId
        in: path
        required: true
        description: User to unblock.
        schema:
          type: integer
          format: int64
          minimum: 1
    delete:
      operationId: unblockUser
      tags: [blocks]
      summary: Remove a user from the personal blacklist
      description: >-
        Idempotent. Unblocking never revives previously cancelled chains.
        Returns 204 when the pair was never blocked; 404 only when the target
        user does not exist.
      responses:
        "204":
          description: Unblocked (or nothing to unblock)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/reports:
    post:
      operationId: createReport
      tags: [moderation]
      summary: Report a specific message in an accessible chat
      description: >-
        Only a participant of the chat may report a message sent by another
        participant. Repeated reports of the same message are idempotent.
        comment is optional for spam/abuse and required for other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReport"
        "200":
          description: Idempotent duplicate of an existing report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{userId}/reports:
