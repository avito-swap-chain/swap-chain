        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      operationId: createUserReport
      tags: [moderation]
      summary: Report another user
      description: >-
        The authenticated user cannot report themselves. When chainId is
        supplied, both users must be participants of that chain. Repeated
        reports for the same user and chain are idempotent. comment is required
        for reason other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserReportRequest"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserReport"
        "200":
          description: Idempotent duplicate of an existing report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

