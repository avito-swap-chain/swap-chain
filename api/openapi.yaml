openapi: 3.1.0
info:
  title: Swap Chain API
  version: 0.2.0
  description: REST contract for the swap-chain MVP backend.
servers:
  - url: http://localhost:8080
    description: Local backend
tags:
  - name: System
    description: Service diagnostics
  - name: Matching
    description: Search for cyclic item exchanges
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check backend and database readiness
      tags: [System]
      responses:
        "200":
          description: Backend and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                database: up
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /items/{itemId}/matching:
    get:
      operationId: findMatchingCycles
      summary: Find exchange cycles that contain the requested item
      tags: [Matching]
      parameters:
        - name: itemId
          in: path
          required: true
          description: Positive item identifier
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Matching completed; cycles can be empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingResponse"
              example:
                itemId: 1
                cycles:
                  - edges:
                      - sourceItemId: 1
                        targetItemId: 2
                        score: 0.83
                      - sourceItemId: 2
                        targetItemId: 1
                        score: 0.79
        "400":
          description: Invalid item identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Matching failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          const: ok
        database:
          type: string
          const: up
    MatchingResponse:
      type: object
      additionalProperties: false
      required: [itemId, cycles]
      properties:
        itemId:
          type: integer
          minimum: 1
        cycles:
          type: array
          items:
            $ref: "#/components/schemas/MatchingCycle"
    MatchingCycle:
      type: object
      additionalProperties: false
      required: [edges]
      properties:
        edges:
          type: array
          items:
            $ref: "#/components/schemas/MatchingEdge"
    MatchingEdge:
      type: object
      additionalProperties: false
      required: [sourceItemId, targetItemId, score]
      properties:
        sourceItemId:
          type: integer
          minimum: 1
        targetItemId:
          type: integer
          minimum: 1
        score:
          type: number
          minimum: 0
          maximum: 1
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
