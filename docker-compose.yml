name: swap-chain

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swap_chain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swap_chain}
      POSTGRES_DB: ${POSTGRES_DB:-swap_chain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    image: swap-chain-backend:local
    build:
      context: ./backend
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-swap_chain}:${POSTGRES_PASSWORD:-swap_chain}@postgres:5432/${POSTGRES_DB:-swap_chain}?sslmode=disable
      MIGRATIONS_URL: file:///app/migrations
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: swap-chain-backend:local
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-swap_chain}:${POSTGRES_PASSWORD:-swap_chain}@postgres:5432/${POSTGRES_DB:-swap_chain}?sslmode=disable
      HTTP_ADDR: :8080
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:18080}
      SESSION_TTL: ${SESSION_TTL:-24h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1}
      OLLAMA_EMBEDDINGS_MODEL: ${OLLAMA_EMBEDDINGS_MODEL:-bge-m3}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-swap-chain-media}
      MINIO_USE_SSL: "false"
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-10485760}
      MATCHING_SIMILAR_ITEMS: ${MATCHING_SIMILAR_ITEMS:-20}
      MATCHING_CHAIN_LENGTH: ${MATCHING_CHAIN_LENGTH:-3}
      MATCHING_PENALTY_FACTOR: ${MATCHING_PENALTY_FACTOR:-0.25}
      MATCHING_CHAIN_THRESHOLD: ${MATCHING_CHAIN_THRESHOLD:-0.30}
      MATCHING_COMPATIBILITY_THRESHOLD: ${MATCHING_COMPATIBILITY_THRESHOLD:-0.50}
      ANALYSIS_CATEGORY_SIMILARITY_THRESHOLD: ${ANALYSIS_CATEGORY_SIMILARITY_THRESHOLD:-0.65}
      ANALYSIS_CATEGORY_CONFIDENCE_MARGIN: ${ANALYSIS_CATEGORY_CONFIDENCE_MARGIN:-0.05}
      ANALYSIS_RECOVERY_POLL_INTERVAL: ${ANALYSIS_RECOVERY_POLL_INTERVAL:-30s}
      ANALYSIS_STALE_AFTER: ${ANALYSIS_STALE_AFTER:-5m}
      ANALYSIS_RECOVERY_BATCH_SIZE: ${ANALYSIS_RECOVERY_BATCH_SIZE:-100}
      ANALYSIS_BOOTSTRAP_TIMEOUT: ${ANALYSIS_BOOTSTRAP_TIMEOUT:-5m}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: ${ANALYSIS_BOOTSTRAP_TIMEOUT:-5m}

  ollama:
    image: ollama/ollama:0.32.6
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:0.32.6
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling ${OLLAMA_EMBEDDINGS_MODEL:-bge-m3}..."
        ollama pull ${OLLAMA_EMBEDDINGS_MODEL:-bge-m3}
        echo "Pulling ${OLLAMA_CHAT_MODEL:-llama3.1}..."
        ollama pull ${OLLAMA_CHAT_MODEL:-llama3.1}
        echo "Models ready."
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.32.6
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    volumes:
      - ./api/openapi.yaml:/spec/openapi.yaml:ro

  frontend:
    build:
      context: ./frontend
      args:
        # Относительный путь, а не абсолютный: фронт запрашивает /api у своего же
        # nginx, который проксирует на backend. С зашитым http://localhost:18080
        # образ работал бы только на машине разработчика — в браузере пользователя
        # этот адрес указывает на его собственный компьютер.
        VITE_API_URL: ${VITE_API_URL:-/}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  ollama_data:
