version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_create_matching_schema.up.sql"
      - "migrations/000002_add_mvp_lifecycle.up.sql"
      - "migrations/000003_add_user_phone.up.sql"
      - "migrations/000004_add_chain_cycle_key.up.sql"
      - "migrations/000005_add_analysis_metadata.up.sql"
      - "migrations/000006_add_admin_delivery_flow.up.sql"
      - "migrations/000007_add_chain_chat.up.sql"
      - "migrations/000008_add_delivery_completion.up.sql"
      - "migrations/000009_add_matching_local_analysis_fields.up.sql"
      - "migrations/000010_align_analysis_matching_schema.up.sql"
      - "migrations/000011_add_matching_jobs.up.sql"
      - "migrations/000012_manage_exchange_items.up.sql"
      - "migrations/000013_add_user_avatar.up.sql"
      - "migrations/000014_add_notifications.up.sql"
      - "migrations/000015_add_reputation.up.sql"
      - "migrations/000016_add_outbox.up.sql"
      - "migrations/000017_add_chain_rejections.up.sql"
      - "migrations/000018_item_wishes.up.sql"
      - "migrations/000019_categories_external.up.sql"
      - "migrations/000020_add_category_decisions.up.sql"
      - "migrations/000021_migrate_undefined_categories.up.sql"
      - "migrations/000024_add_blocklist_and_moderation.up.sql"
    queries: "sql/queries"
    gen:
      go:
        package: "db"
        out: "shared/db"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        overrides:
          - db_type: "vector"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              type: "Vector"
              pointer: true
