version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_create_matching_schema.up.sql"
      - "migrations/000002_add_mvp_lifecycle.up.sql"
      - "migrations/000005_add_analysis_metadata.up.sql"
    queries: "sql/queries"
    gen:
      go:
        package: "db"
        out: "shared/db"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        overrides:
          - db_type: "vector"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              type: "Vector"
