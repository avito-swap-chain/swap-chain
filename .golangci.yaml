version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  exclusions:
    generated: lax
    rules:
      - path: "(?:internal/api/.*\\.gen\\.go|shared/db/.*\\.sql\\.go)"
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
