version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  exclusions:
    generated: lax
    rules:
      - path: "(?:internal/api/.*\\.gen\\.go|shared/db/.*\\.sql\\.go)"
        linters:
          - errcheck
      # Most packages are internal implementation details. Requiring GoDoc for
      # every exported symbol there produces boilerplate without protecting a
      # public API; correctness-oriented revive checks remain enabled.
      - text: "(?:exported|package-comments):"
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
